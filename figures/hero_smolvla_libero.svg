  <title id="title">SmolVLA fine-tuning and closed-loop evaluation summary</title>
  <desc id="desc">A pinned SmolVLA and LIBERO stack is fine-tuned for one hundred thousand optimizer updates on one RTX 4090, audited, and evaluated across four hundred closed-loop episodes with 71.5 percent overall endpoint success.</desc>
